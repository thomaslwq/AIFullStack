server:
  port: 8080

spring:
  application:
    name: ai-chat-api
  datasource:
    url: jdbc:mysql://localhost:3306/ai_chat?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret}
  llm:
    base-url: ${LLM_BASE_URL:https://api.example.com}
    api-key: ${LLM_API_KEY:}
